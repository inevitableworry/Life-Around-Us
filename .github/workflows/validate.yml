name: Validate source
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  syntax-and-rights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify frontend JavaScript syntax
        shell: bash
        run: |
          find web/public -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
          node --check web/server.mjs
      - name: Ensure no protected bundles in tracked source
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(original-pkgs|user-source-drop|node_modules|\.env|\.cloudflared)/|\.(pkg|self|prx|p12|pfx)$'; then
            echo 'Forbidden private/console artifact in repository'
            exit 1
          fi
      - name: Check source tree and legal notices
        shell: bash
        run: |
          test -f README.md
          test -f ROADMAP.md
          test -f docs/THIRD_PARTY_NOTICES.md
          test -f platforms/samsung-tizen/config.xml
