  <circle cx="32" cy="32" r="17" fill="url(#g)"/>
  <path d="M19.5 27 q6.5 -4 12.5 0 t12.5 0" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M18 36 q7 -4 14 0 t14 0" fill="none" stroke="#fff" stroke-opacity="0.26" stroke-width="2.4" stroke-linecap="round"/>
