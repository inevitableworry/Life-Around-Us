<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Life Around Us mark: a calm planet with a companion dot on a tilted orbit. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fd0c4"/>
      <stop offset="1" stop-color="#2f7f78"/>
    </linearGradient>
    <clipPath id="front"><rect x="-10" y="34" width="84" height="40" transform="rotate(-18 32 34)"/></clipPath>
  </defs>
  <g transform="rotate(-18 32 34)">
    <ellipse cx="32" cy="34" rx="29" ry="10" fill="none" stroke="#e9dcc9" stroke-width="2.6" opacity="0.45"/>
