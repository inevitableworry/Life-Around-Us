[Tracker]
#Enabled=true
Enabled=false
#Flags for selecting what is displayed in the tracking point
ShowLocation=false	#shows the file name & line number of the track point
ShowTime=true		#shows the timestamp of the track point
ShowDescription=true	#shows the string description of the track point
ShowReference=true	#shows the reference number of the track point
ShowThread=true		#shows the thread id of the track point

LogDir="/app_home/Tracker"	#directory to store the log files
#LogDir="/dev_hdd0/game/WLOP94107/USRDIR"
LogFile="Log.csv"	#log all track points to a file
UseWlopLog=false	#log all track points to the WLOP log
UseIdLogFiles=true	#log track points for each ID in their own file
MaxIds=-1		#maximum number of IDs to track (-1 for all)

[SuperContainer]
Contains.MessageServiceContainer="MessageServiceContainer"
Contains.MetadataUpdaterContainer="MetadataUpdaterContainer"
Contains.DsContainer="DsContainer"
Contains.ConfiguratorContainer="ConfiguratorContainer"
Contains.SourceContainer="SourceContainer"
Contains.ManagerContainer="ManagerContainer"
Contains.PolicyContainer="PolicyContainer"
Contains.ActionQueueContainer="ActionQueueContainer"
Contains.ExtractionEngineContainer="ExtractionEngineContainer"
Contains.FilterContainer="FilterContainer"
UseConfigurator=true
Autoload1="ManagerContainer:Manager"

[MetadataUpdaterContainer]
id="@sony.com:/genericcontainer;1"
Contains.MetadataUpdaterCSS="MetadataUpdaterCSS"

[MetadataUpdaterCSS]
id="@sony.com:/metadataupdater;1"
sourceName.1="CSS"
allowedTags="ia.echo.rating,ia.echo.playcount,ia.echo.datelastplayed"
ignoreNotAllowed=false
#createNewTags=false

[ManagerContainer]
id="@sony.com:/genericcontainer;1"
Contains.Manager="Manager"

[Manager]
id="@sony.com:/manager;1"
Source.CSS="CSS"
Policy.PassThroughPolicy="PassThroughPolicy"
Policy.ExtractionPolicy="ExtractionPolicy"

#######################################################################
# Filters
#

#
# Contains all filters used for presentation of data.
#
[FilterContainer]
id="@sony.com:/genericcontainer;1"
Contains.EchoFilter="EchoFilter"

# Provides data as a flat, sorted list.
[EchoFilter]
id="@sony.com:/echofilter;1"
SupportMakeTree=true
RequireContext=false

[PolicyContainer]
id="@sony.com:/genericcontainer;1"
Contains.PassThroughPolicy="PassThroughPolicy"
Contains.ExtractionPolicy="ExtractionPolicy"

[PassThroughPolicy]
id="@sony.com:/passthroughpolicy;1"
actionQueueContainer="ActionQueueContainer"
actionQueue="PolicyQueue"
source="CSS"
sourceList="CSS"
ignoreManage=true

[ExtractionPolicy]
id="@sony.com:/extractionpolicy;1"
lcsName="CSS"
engine.1-SmfmfExtractionEngine="SmfmfExtractionEngine"
engine.2-MusicChannelExtractionEngine="MusicChannelExtractionEngine"
maxRetries=5
ignoreManage=true

[MessageServiceContainer]
id="@sony.com:/genericcontainer;1"
Contains.MessageService="MessageService"

[DsContainer]
id="@sony.com:/dscontainer;1"
type="sqlite3"
database="db.sqlite"
verbose=false
#checkRecreate="checkDbRecreate"
recreateDb=false
Contains.MasterMds="MasterMds"
Contains.ContentSearchMds="ContentSearchMds"
Contains.MediaMds="MediaMds"
Contains.EchoMds="EchoMds"
Contains.ExtractionStatusMds="ExtractionStatusMds"
Contains.ConfigDs="ConfigDs"

[MasterMds]
id="@sony.com:/mastermds;1"
DsContainer="DsContainer"
Mds.1="ContentSearchMds"
Mds.2="MediaMds"
Mds.3="EchoMds"
Mds.4="ExtractionStatusMds"
CacheSize=36

[ContentSearchMds]
id="@sony.com:/contentsearchmds;1"

[MediaMds]
id="@sony.com:/mediamds;1"

[EchoMds]
id="@sony.com:/echomds;1"

[ExtractionStatusMds]
id="@sony.com:/extractionstatusmds;1"

[ConfigDs]
id="@sony.com:/configds;1"

[SourceContainer]
id="@sony.com:/genericcontainer;1"
Contains.CSS="CSS"

[MessageService]
id="@sony.com:/messageservice;1"
port=6644
StackSize=32
NumThreads=5
Priority=50

[CSS]
id="@sony.com:/contentsearchsource;1"
resourceDir=".resources"
DsContainer="DsContainer"
masterMds="MasterMds"
contentSearchMds="ContentSearchMds"
#updateExisting=false
maxItems=1000
mutexContentSearch=false
monitorSysutilEvents=true
removeContextsOnInit=false
recreateCount = 2000
#checkContextRemove="checkContextRemove"
checkDbRecreate="checkDbRecreate"
ignoreSweepDeletes=true
postponeDeleteEvents=false
randomizeEvents=true
searchStackSize=8
searchPriority=50
storeContexts=false
useCellSearchContainer=false

[ActionQueueContainer]
id="@sony.com:/genericcontainer;1"
Contains.PolicyQueue="PolicyQueue"
Contains.ActionQueue="ActionQueue"
Contains.ExtractionQueue="ExtractionQueue"

[PolicyQueue]
id="@sony.com:/actionqueue;1"
threads=3
StackSize=32
Priority=50

[ActionQueue]
id="@sony.com:/actionqueue;1"
threads=3
StackSize=32
Priority=50

[ExtractionQueue]
id="@sony.com:/actionqueue;1"
threads=3
StackSize=32
Priority=50

[ExtractionEngineContainer]
id="@sony.com:/genericcontainer;1"
Contains.1-SmfmfExtractionEngine="SmfmfExtractionEngine"
Contains.2-MusicChannelExtractionEngine="MusicChannelExtractionEngine"

[SmfmfExtractionEngine]
id="@sony.com:/smfmfextraction;1"
rootPath=""

[MusicChannelExtractionEngine]
id="@sony.com:/musicchannelextraction;1"
rootPath=""


####
#######################################################################
# Configurator
#

#
# Contains the Configurator
#
[ConfiguratorContainer]
id="@sony.com:/genericcontainer;1"
Contains.Configurator="Configurator"
Contains.ConfigurationManager="ConfigurationManager"

[ConfigurationManager]
id="@sony.com:/configurationmanager;1"
NetworkSource.NCS="NCS"
NetworkSource.NCS2="NCS2"

#
# The Configurator is used to appropriately distribute configuration
# information among remote instances of WLOP.
#
[Configurator]
id="@sony.com:/configurator;1"
configDsContainer="DsContainer"
configDs="ConfigDs"
UseNetworking=false
